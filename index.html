/* PocketFlow Atelier V4: designed as a calm private-banking experience, not a neon template */
:root{--ink:#f5f7fa;--subtle:#9ba9be;--electric:#1558c9;--acid:#d4ff24;--edge:rgba(178,199,239,.115)}
html{background:#030407}body{background:radial-gradient(ellipse 100% 33% at 89% 0%,rgba(21,88,201,.26),transparent 66%),#030407;color:var(--ink);padding-bottom:118px}

}

</style></head><body><header><h1>◈ Pocket<span>Flow</span></h1><small>PRIVATE · ON DEVICE</small></header><main id="app"></main><nav id="nav" class="nav"></nav><script>
"use strict";
const KEY="pocketflow.personal.v1",categories=["Food","Shopping","Bills","Transport","Rent","EMI","Health","Entertainment","Travel","Groceries","Salary","Refund","Other"];
let db=read(),tab="home",pending=[];
function read(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.accounts)&&Array.isArray(d.transactions))return d}catch(e){}return {accounts:[],transactions:[],period:"month"}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function uid(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function INR(v){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(v||0)}
function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function acct(id){return db.accounts.find(a=>a.id===id)?.name||"Unknown"}
function balance(id){let a=db.accounts.find(a=>a.id===id);return (Number(a?.opening)||0)+db.transactions.reduce((s,t)=>s+(t.account===id?(["income","transfer-in"].includes(t.type)?t.amount:-t.amount):0),0)}
function visible(){let now=today(),week=new Date();week.setDate(week.getDate()-(week.getDay()+6)%7);let monday=[week.getFullYear(),String(week.getMonth()+1).padStart(2,"0"),String(week.getDate()).padStart(2,"0")].join("-");return db.transactions.filter(t=>db.period==="all"||db.period==="day"&&t.date===now||db.period==="week"&&t.date>=monday&&t.date<=now||db.period==="month"&&t.date.slice(0,7)===now.slice(0,7))}
function totals(){let t=visible();return {income:t.filter(x=>x.type==="income").reduce((s,x)=>s+x.amount,0),expense:t.filter(x=>x.type==="expense").reduce((s,x)=>s+x.amount,0)}}
function change(v){tab=v;render();scrollTo(0,0)}
function filters(){return '<div class="filters">'+[["day","Today"],["week","This week"],["month","This month"],["all","All time"]].map(([k,v])=>'<button class="'+(db.period===k?"on":"")+'" onclick="db.period=\''+k+'\';save()">'+v+'</button>').join("")+'</div>'}
function lines(xs){if(!xs.length)return '<div class="empty">No transactions yet</div>';const icons={Food:"🍽",Shopping:"🛍",Bills:"⚡",Transport:"🚕",Rent:"🏠",EMI:"📅",Health:"✚",Entertainment:"🎬",Travel:"✈",Groceries:"🛒",Salary:"↙",Refund:"↙",Other:"◈",Transfer:"⇄"};return [...xs].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).map(t=>'<div class="row"><div class="transaction-line" style="min-width:0"><div class="transaction-icon">'+(icons[t.category]||"◈")+'</div><div class="transaction-details"><strong>'+esc(t.note||t.category||"Transfer")+'</strong><div class="muted" style="margin-top:5px">'+esc(t.date)+' · '+esc(acct(t.account))+'</div><div class="hint">'+esc(t.category||"Transfer")+'</div></div></div><div style="text-align:right;flex-shrink:0"><strong class="'+(["income","transfer-in"].includes(t.type)?"green":"red")+'">'+(["income","transfer-in"].includes(t.type)?"+":"−")+INR(t.amount)+'</strong><div><button class="btn secondary" style="padding:5px 9px;margin-top:7px;font-size:10px" onclick="del(\''+t.id+'\')">Delete</button></div></div></div>').join("")}
function home(){let t=totals(),sum=db.accounts.reduce((s,a)=>s+balance(a.id),0),spent={},expenses=visible().filter(x=>x.type==="expense");expenses.forEach(x=>spent[x.category]=(spent[x.category]||0)+x.amount);let top=Object.entries(spent).sort((a,b)=>b[1]-a[1]),net=t.income-t.expense;if(!db.accounts.length)return '<div class="welcome"><span class="eyebrow">WELCOME TO POCKETFLOW</span><h2>Money, finally<br><em>in focus.</em></h2><p>Track every rupee without clutter. Start by adding an account.</p><div class="welcome-orb">◈</div><button class="btn" onclick="change(\'accounts\')">Add your first account ↗</button></div><div class="card"><h3>Get started</h3><div class="step"><b>01</b><div><strong>Add your account</strong><p>Just a nickname and starting balance.</p></div></div><div class="step"><b>02</b><div><strong>Import a bank CSV</strong><p>Categories and summaries update automatically. Live bank sync is not connected.</p></div></div></div>';let week=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");week.push({day:["S","M","T","W","T","F","S"][d.getDay()],amount:db.transactions.filter(x=>x.type==="expense"&&x.date===date).reduce((sum,x)=>sum+x.amount,0)})}let max=Math.max(1,...week.map(x=>x.amount));return '<div class="headline"><div><span class="eyebrow">YOUR MONEY AT A GLANCE</span><h2>Overview<span class="dot">.</span></h2></div><span class="sync-chip">● Offline tracking</span></div><div class="card hero"><div class="kicker">TOTAL TRACKED BALANCE</div><div class="balance">'+INR(sum)+'</div><div class="tiles"><div class="tile"><div class="muted">↙ Income</div><div class="value green">'+INR(t.income)+'</div></div><div class="tile"><div class="muted">↗ Spending</div><div class="value red">'+INR(t.expense)+'</div></div></div><p class="balance-foot">Calculated from records · Not a live bank balance</p></div><div class="premium-actions"><button class="primary-action" onclick="change(\'add\')"><span class="primary-symbol">＋</span><span><strong>Add a transaction</strong><small>Quick money in or out</small></span><span class="action-chevron">↗</span></button><div class="secondary-actions"><button onclick="change(\'import\')"><span>⇩</span> Import statement <i>↗</i></button><button onclick="change(\'accounts\')"><span>▦</span> All accounts <i>↗</i></button></div></div><div class="section-head"><h3>Cash flow</h3><span class="quiet">Choose period</span></div>'+filters()+'<div class="metrics"><div class="metric"><small>NET CASH FLOW</small><strong>'+INR(net)+'</strong><span>Income minus spending</span></div><div class="metric"><small>TOP CATEGORY</small><strong>'+esc(top[0]?.[0]||"—")+'</strong><span>'+(top[0]?INR(top[0][1]):"No spending yet")+'</span></div></div><div class="section-head"><h3>Last 7 days</h3><span class="quiet">Daily spending</span></div><div class="card chart-card"><div class="bar-chart">'+week.map(x=>'<div class="bar-group"><div class="bar-track"><div class="bar-fill" style="height:'+Math.round(x.amount/max*100)+'%"></div></div><span>'+x.day+'</span></div>').join("")+'</div></div><div class="section-head"><h3>Your banks</h3><button onclick="change(\'accounts\')">View all ↗</button></div><div class="card">'+db.accounts.slice(0,4).map(a=>'<div class="bank-mini"><div class="bank-avatar">'+esc(a.name.slice(0,2).toUpperCase())+'</div><div class="bank-words"><b>'+esc(a.name)+'</b><small>'+esc(a.kind)+' · Tracked locally</small></div><div class="bank-money">'+INR(balance(a.id))+'</div></div>').join("")+'</div><div class="section-head"><h3>Recent activity</h3><button onclick="change(\'history\')">See all ↗</button></div><div class="card">'+lines([...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,5))+'</div><p class="privacy-inline">✧ Back up your data regularly from More.</p>'}
function accounts(){return '<h2>Your banks</h2><div class="notice">These balances are calculated from your opening balances and saved transactions. They are NOT connected live to banks.</div><div class="card">'+(db.accounts.map(a=>'<div class="row"><div><strong>'+esc(a.name)+'</strong><div class="muted">'+esc(a.kind)+'</div></div><b>'+INR(balance(a.id))+'</b></div>').join("")||'<div class="empty">Add your first bank or cash account.</div>')+'</div><div class="card"><h3>Add bank or cash</h3><form id="accountForm"><label>Account name</label><input name="name" placeholder="HDFC / IDFC / HSBC" required maxlength="70"><div class="grid"><div><label>Type</label><select name="kind"><option>Bank</option><option>Cash</option><option>Wallet</option></select></div><div><label>Starting balance ₹</label><input type="number" name="opening" step=".01" required value="0"></div></div><div class="actions"><button class="btn">Save account</button></div></form></div>'}
function accountOptions(){return db.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join("")}
function add(){if(!db.accounts.length)return '<div class="card"><h3>First add an account</h3><p class="muted">Money in and out needs a bank or cash account.</p><button class="btn" onclick="change(\'accounts\')">Add your bank ↗</button></div>';return '<div class="headline"><div><span class="eyebrow">KEEP IT SIMPLE</span><h2>New entry<span class="dot">.</span></h2></div></div><p class="screen-sub">Fast entry with smart category suggestions.</p><div class="card form-card"><form id="transactionForm"><label>Type</label><select name="type" id="kind" onchange="typeChange()"><option value="expense">↗ Money out</option><option value="income">↙ Money in</option><option value="transfer">⇄ Between my accounts</option></select><label>Amount</label><div class="amount-wrap"><span>₹</span><input class="amount-input" name="amount" type="number" placeholder="0" required min=".01" step=".01" inputmode="decimal"></div><div class="grid"><div><label>Account</label><select name="account">'+accountOptions()+'</select></div><div><label>Date</label><input name="date" type="date" required value="'+today()+'"></div></div><div id="destination" class="hide"><label>Transfer to account</label><select name="to">'+accountOptions()+'</select></div><label>Merchant / note</label><input id="noteField" name="note" maxlength="220" placeholder="e.g. Swiggy, salary, petrol" oninput="suggestCategory()" autocomplete="off"><div id="category"><label>Category <span class="auto-label">✦ Suggested</span></label><select id="categorySelect" name="category">'+categories.map(x=>'<option>'+x+'</option>').join("")+'</select></div><button class="btn save-action">Save transaction ↗</button></form></div><p class="privacy-inline">Nothing is charged or paid through PocketFlow.</p>'}
function typeChange(){let t=document.getElementById("kind").value;document.getElementById("destination").classList.toggle("hide",t!=="transfer");document.getElementById("category").classList.toggle("hide",t==="transfer");suggestCategory()}
function suggestCategory(){let n=document.getElementById("noteField"),k=document.getElementById("kind"),c=document.getElementById("categorySelect");if(n&&k&&c&&n.value.trim())c.value=category(n.value,k.value)}
function history(){return '<div class="headline"><div><span class="eyebrow">EVERY RUPEE, ORGANISED</span><h2>Activity<span class="dot">.</span></h2></div></div><div class="search-wrap"><span>⌕</span><input id="historySearch" type="search" placeholder="Search merchant, bank or category" oninput="filterHistory(this.value)"></div>'+filters()+'<div class="card" id="historyRows">'+lines(visible())+'</div>'}
function filterHistory(q){let value=q.trim().toLowerCase(),items=visible().filter(t=>(t.note+" "+t.category+" "+acct(t.account)).toLowerCase().includes(value));document.getElementById("historyRows").innerHTML=lines(items)}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function backup(){download("PocketFlow-backup-"+today()+".json",JSON.stringify({version:1,...db},null,2),"application/json")}
function csvExport(){let rows=[["Date","Type","Bank","Amount","Category","Note"],...db.transactions.map(x=>[x.date,x.type,acct(x.account),x.amount,x.category,x.note])];download("PocketFlow-"+today()+".csv",rows.map(r=>r.map(s=>'"'+String(s??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv")}
function settings(){return '<div class="headline"><div><span class="eyebrow">YOU ARE IN CONTROL</span><h2>More<span class="dot">.</span></h2></div></div><div class="card"><h3>Bank connection</h3><div class="connection-status"><span class="status-orb">!</span><div><strong>Not connected</strong><p>Live bank syncing needs an authorised consent-based banking provider. No banks are connected.</p></div></div><p class="screen-sub">Never enter a bank password, OTP or UPI PIN here.</p></div><div class="card"><h3>Import transactions</h3><p class="screen-sub">Use a bank CSV statement to avoid entering each expense manually.</p><button class="btn secondary" onclick="change(\'import\')">Import CSV ↗</button></div><div class="card"><h3>Backup & privacy</h3><p class="screen-sub">Your entries are saved in this device’s browser, not encrypted. Clearing site data may delete them. Download regular backups.</p><div class="actions"><button class="btn" onclick="backup()">Save backup</button><button class="btn secondary" onclick="csvExport()">Export CSV</button></div><label>Restore previous backup</label><input type="file" accept=".json" id="restore"><button class="btn secondary" style="margin-top:12px" onclick="restore()">Restore backup</button><p class="hint">Backups are unencrypted. Store them privately.</p></div><div class="card"><h3>iPhone installation</h3><p class="screen-sub">Safari → Share → Add to Home Screen → Add.</p></div><div class="card"><button class="btn danger" onclick="erase()">Erase local data</button></div>'}
function restore(){let f=document.getElementById("restore").files[0];if(!f)return alert("Choose backup file");f.text().then(t=>{try{let d=JSON.parse(t);if(!Array.isArray(d.accounts)||!Array.isArray(d.transactions))throw Error("Invalid file");if(!confirm("Replace ALL existing data with this backup?"))return;db={accounts:d.accounts,transactions:d.transactions,period:"month"};save()}catch(e){alert("Invalid backup: "+e.message)}})}
function erase(){if(confirm("Erase all saved account and transaction data?")){db={accounts:[],transactions:[],period:"month"};save()}}
function del(id){let t=db.transactions.find(t=>t.id===id);if(!t||!confirm("Delete this transaction?"))return;db.transactions=db.transactions.filter(x=>x.id!==id&&(!t.group||x.group!==t.group));save()}
function csvParse(s){let out=[],row=[],f="",quote=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){f+='"';i++}else quote=!quote}else if(c===","&&!quote){row.push(f);f=""}else if((c==="\n"||c==="\r")&&!quote){if(c==="\r"&&s[i+1]==="\n")i++;row.push(f);if(row.some(x=>x.trim()))out.push(row);f="";row=[]}else f+=c}row.push(f);if(row.some(x=>x.trim()))out.push(row);return out}
function parseDate(s){s=String(s||"").trim();if(/^\d{4}-\d\d-\d\d/.test(s))return s.slice(0,10);let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);return m?(m[3].length===2?"20"+m[3]:m[3])+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"):null}
function num(s){return Number(String(s||"").replace(/[₹,\s]/g,"").replace(/^\((.*)\)$/,"-$1"))||0}
function category(note,type){if(type==="income")return /salary|payroll|wage/i.test(note)?"Salary":/refund|reversal/i.test(note)?"Refund":"Other";let n=note.toLowerCase();return /swiggy|zomato|restaurant|cafe|coffee/.test(n)?"Food":/uber|ola|metro|fuel|petrol/.test(n)?"Transport":/amazon|flipkart|meesho|myntra/.test(n)?"Shopping":/emi|loan|nach/.test(n)?"EMI":/electric|recharge|bill|broadband/.test(n)?"Bills":/grocery|mart|supermarket/.test(n)?"Groceries":"Other"}
function importPage(){return '<h2>Import bank statement</h2><div class="notice">CSV import only. Not a live bank connection. Check each row before import.</div><div class="card"><form id="csvForm"><label>Choose bank account</label><select name="account">'+accountOptions()+'</select><label>CSV file</label><input type="file" name="file" accept=".csv,text/csv" required><p class="hint">Example headers: Date, Description, Debit, Credit. Or Date, Amount, Type.</p><button class="btn">Preview transactions</button></form><div id="preview"></div></div>'}
function preview(file,account){let rows=csvParse(file),h=rows.shift().map(x=>x.toLowerCase().replace(/[^a-z]/g,"")),idx=(...ns)=>h.findIndex(x=>ns.some(n=>x.includes(n))),d=idx("date"),n=idx("description","narration","particular","remark","details"),deb=idx("debit","withdrawal"),cred=idx("credit","deposit"),amt=idx("amount"),typ=idx("type","drcr");if(d<0||deb<0&&cred<0&&amt<0)throw Error("Unsupported CSV headers");let existing=new Set(db.transactions.map(x=>x.fingerprint)),seen=new Set(),skipped=0;pending=[];for(let r of rows){let date=parseDate(r[d]);if(!date)continue;let note=String(r[n]||"Imported").slice(0,220),out=Math.abs(num(r[deb])),inc=Math.abs(num(r[cred]));if(deb<0&&cred<0){let a=num(r[amt]),k=String(r[typ]||"").toLowerCase();if(/credit|cr/.test(k)||a>0&&String(r[amt]).includes("+"))inc=Math.abs(a);else out=Math.abs(a)}for(let [type,amount] of [["expense",out],["income",inc]])if(amount>0){let fingerprint=[account,date,type,amount,note.toLowerCase().trim().replace(/\s+/g," ")].join("|");if(existing.has(fingerprint)||seen.has(fingerprint)){skipped++;continue}seen.add(fingerprint);pending.push({id:uid(),account,date,type,amount,note,category:category(note,type),fingerprint,source:"csv",created:Date.now()})}}document.getElementById("preview").innerHTML='<h3>Review import</h3><p class="hint">'+pending.length+' new · '+skipped+' possible duplicates skipped</p><div style="max-height:290px;overflow:auto">'+lines(pending.slice(0,20))+'</div><button class="btn" onclick="confirmImport()">Import '+pending.length+' transactions</button>'}
function confirmImport(){db.transactions.push(...pending);pending=[];change("home");save()}
function render(){let map={home,accounts,add,history,import:importPage,settings};document.getElementById("app").innerHTML=map[tab]();document.getElementById("nav").innerHTML=[["home","Home","M3 10.25 12 3l9 7.25V21h-6v-6H9v6H3z"],["history","Activity","M4 7h16M4 12h16M4 17h11"],["add","Add","M12 5v14M5 12h14"],["accounts","Accounts","M3 7h18v13H3zM3 10h18M7 4h10"],["settings","More","M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 8v.01M12 12v5"]].map(([k,v,p])=>'<button class="'+(tab===k?"on":"")+'" aria-label="'+v+'" onclick="change(\''+k+'\')"><span class="nav-symbol"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg></span><span class="nav-label">'+v+'</span></button>').join("");let f=document.getElementById("accountForm");if(f)f.onsubmit=e=>{e.preventDefault();let v=new FormData(f),opening=Number(v.get("opening"));if(!Number.isFinite(opening))return alert("Invalid balance");db.accounts.push({id:uid(),name:String(v.get("name")).trim(),opening,kind:v.get("kind")});save()};f=document.getElementById("transactionForm");if(f)f.onsubmit=e=>{e.preventDefault();let v=new FormData(f),amount=Number(v.get("amount")),type=v.get("type"),account=v.get("account"),dest=v.get("to");if(!Number.isFinite(amount)||amount<=0)return alert("Invalid amount");if(type==="transfer"&&(account===dest||db.accounts.length<2))return alert("Select different accounts");let base={id:uid(),date:v.get("date"),amount,note:String(v.get("note")||"").trim(),created:Date.now()};if(type==="transfer"){let group=uid();db.transactions.push({...base,type:"transfer-out",account,group,category:"Transfer"},{...base,id:uid(),type:"transfer-in",account:dest,group,category:"Transfer"})}else db.transactions.push({...base,type,account,category:v.get("category")});change("home");save()};f=document.getElementById("csvForm");if(f)f.onsubmit=async e=>{e.preventDefault();let v=new FormData(f),file=v.get("file");if(!file||!file.size)return;if(file.size>8000000)return alert("Use CSV under 8 MB");try{preview(await file.text(),v.get("account"))}catch(err){alert(err.message)}}}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});render();

/* Only visual feedback; never changes or transmits financial records. */
document.addEventListener("pointerdown",function(ev){
 if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const btn=ev.target.closest("button.primary-action");
 if(!btn)return;
 const box=btn.getBoundingClientRect();
 const ripple=document.createElement("span");
 ripple.className="pf-tap";
 ripple.style.left=(ev.clientX-box.left)+"px";
 ripple.style.top=(ev.clientY-box.top)+"px";
 btn.appendChild(ripple);
 ripple.addEventListener("animationend",()=>ripple.remove(),{once:true});
});
