/* PocketFlow Noir / Cobalt / Acid-Lime design system */
:root{--midnight:#030407;--cobalt:#1558C9;--lime:#D4FF24;--ink:#f3f5f9;--muted:#9ca9bb;color:var(--ink);background:var(--midnight)}
body{background:radial-gradient(ellipse 100% 48% at 88% 1%,#0e327c90 0%,transparent 60%),radial-gradient(ellipse 95% 75% at -35% 42%,#071f4e85 0%,transparent 60%),#030407;color:var(--ink)}
header{padding-top:calc(27px + env(safe-area-inset-top));padding-bottom:18px;border-bottom:1px solid #ffffff0b}
h1{font-weight:850;letter-spacing:-1.45px}h1:first-letter{color:var(--lime)}h1 span{color:#eef4ff}

.card{background:linear-gradient(145deg,#131b2d 0%,#090f1b 65%,#070c14 100%);border-color:#35445f75;border-radius:22px;box-shadow:0 16px 32px #00000050,inset 0 1px #ffffff0d}
.hero{background:radial-gradient(ellipse at 83% 15%,#145dd1aa 0%,transparent 42%),radial-gradient(ellipse at -20% 115%,#123a7db8 0%,transparent 65%),linear-gradient(140deg,#080f20,#02050e 90%);border:1px solid #326dcc99;border-radius:27px;box-shadow:0 23px 50px #000b2480,0 0 0 1px #163d7140,inset 0 1px #a5c8ff3a;padding:27px 22px}
.hero:before{width:230px;height:230px;right:-115px;top:-110px;border:1px solid #77a3fa55;box-shadow:0 0 0 25px #1558c914,0 0 0 50px #1558c90b,0 0 60px #1558c92d}
.hero:after{content:"";position:absolute;top:15px;right:21px;width:44px;height:44px;background:radial-gradient(circle at 35% 35%,#d4ff2480,transparent 55%);filter:blur(17px);pointer-events:none}
.hero .kicker{color:#d4ff24;font-size:10px;letter-spacing:2.2px}
.hero .balance{font-size:clamp(39px,9vw,53px);color:#fcfdff;letter-spacing:-2px;text-shadow:0 1px 25px #478bff52}
.hero .tile{background:linear-gradient(145deg,#16213d9e,#061329a3);border:1px solid #5f88c04a;border-radius:16px;backdrop-filter:blur(18px)}
.hero .tile .muted{color:#b5cae2;font-size:11px}
.hero .tile:first-child .value{color:#d4ff24}
.hero .tile:last-child .value{color:#ffb2c1}
.green{color:var(--lime)}.red{color:#ff9cae}
.section-note{border:1px solid #446cab55;background:#0309169c;color:#a8b8d0;font-size:10px;letter-spacing:.1px}
.smart-head h2{font-size:31px;letter-spacing:-1.4px;color:#f4f7ff}
.smart-head p{color:#a5b4c9;letter-spacing:.1px}
.section-head h3{font-size:16px;font-weight:780}
.section-head button,.quiet{color:#b1c9ff}
.btn{background:var(--lime);color:#0b0d07;box-shadow:0 7px 25px #d4ff241b;border:1px solid #eaff75}
.btn.secondary{background:#152c59;color:#e3ecff;border:1px solid #3165ba6b;box-shadow:none}
.btn.danger{background:#481923;color:#ffd4dc;border-color:#8d4255}
.filters{background:#0b1424;border:1px solid #304364;border-radius:15px}
.filters button{color:#a8b7cd}
.filters button.on{background:var(--lime);color:#080b05;box-shadow:0 3px 11px #d4ff2428}
.insight{background:linear-gradient(115deg,#071633,#0b2351 60%,#0c1d37);border:1px solid #2560b0;border-radius:18px}
.insight span{color:var(--lime);font-size:27px!important}
.insight p{color:#aabed9}
.bank-avatar{background:linear-gradient(145deg,#0c4fd8,#071b42);border:1px solid #377ff3;color:#eaf2ff;box-shadow:inset 0 1px 8px #ffffff26,0 6px 16px #00000050}
.bank-mini{border-color:#2e41624d}
.bank-money{color:#f0f5ff}
.transaction-icon{background:linear-gradient(145deg,#102f68,#09142a);border:1px solid #2465c390}
.bar{background:#23324b}
.bar>div{background:linear-gradient(90deg,#1558c9 0%,#4b9aff 55%,#d4ff24 100%)}
.nav{background:#060c15f5;border-color:#2b4a7d;box-shadow:0 -12px 32px #000000bd}
.nav button{color:#92a2bc}
.nav button.on{color:var(--lime)}
.nav button.on b{text-shadow:0 0 17px #d4ff2485}
input,select{border:1px solid #375079;background:#081528;color:#fff}
input:focus,select:focus{outline:2px solid #d4ff24;outline-offset:1px}
.notice{background:#1d1a19;border:1px solid #695c35;color:#e6d8aa}
.pill{color:#cfddf5}
@media(prefers-reduced-motion:no-preference){.card,.bank-avatar,.btn{transition:transform .17s ease,border-color .17s ease}.btn:active{transform:scale(.97)}}

span{font-size:10px;color:#a4b4cd}.welcome{position:relative;margin:14px 0;border:1px solid #3967b0;border-radius:25px;padding:31px 24px;background:radial-gradient(circle at 90% 10%,#175cc2b0,transparent 48%),linear-gradient(140deg,#09234a,#030407 85%);overflow:hidden}.welcome h2{position:relative;font-size:41px;letter-spacing:-2px;line-height:1.1;margin:17px 0}.welcome em{font-style:normal;color:#d4ff24}.welcome p{position:relative;font-size:13px;line-height:1.7;color:#bac8dc;max-width:240px}.welcome-orb{position:absolute;right:-50px;top:60px;font-size:185px;color:#1558c95c;transform:rotate(25deg)}.welcome .btn{position:relative;margin-top:19px}.step{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid #344158}.step:last-child{border:0}.step b{color:#d4ff24;font-size:20px}.step strong{font-size:13px}.step p{font-size:11px;color:#a4b3cc}.privacy-inline{margin:20px 5px;text-align:center;color:#9eacc4;font-size:11px}
</style></head><body><header><h1>◈ Pocket<span>Flow</span></h1><small>PRIVATE · ON DEVICE</small></header><main id="app"></main><nav id="nav" class="nav"></nav><script>
"use strict";
const KEY="pocketflow.personal.v1",categories=["Food","Shopping","Bills","Transport","Rent","EMI","Health","Entertainment","Travel","Groceries","Salary","Refund","Other"];
let db=read(),tab="home",pending=[];
function read(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.accounts)&&Array.isArray(d.transactions))return d}catch(e){}return {accounts:[],transactions:[],period:"month"}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function uid(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function INR(v){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(v||0)}
function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function acct(id){return db.accounts.find(a=>a.id===id)?.name||"Unknown"}
function balance(id){let a=db.accounts.find(a=>a.id===id);return (Number(a?.opening)||0)+db.transactions.reduce((s,t)=>s+(t.account===id?(["income","transfer-in"].includes(t.type)?t.amount:-t.amount):0),0)}
function visible(){let now=today(),week=new Date();week.setDate(week.getDate()-(week.getDay()+6)%7);let monday=[week.getFullYear(),String(week.getMonth()+1).padStart(2,"0"),String(week.getDate()).padStart(2,"0")].join("-");return db.transactions.filter(t=>db.period==="all"||db.period==="day"&&t.date===now||db.period==="week"&&t.date>=monday&&t.date<=now||db.period==="month"&&t.date.slice(0,7)===now.slice(0,7))}
function totals(){let t=visible();return {income:t.filter(x=>x.type==="income").reduce((s,x)=>s+x.amount,0),expense:t.filter(x=>x.type==="expense").reduce((s,x)=>s+x.amount,0)}}
function change(v){tab=v;render();scrollTo(0,0)}
function filters(){return '<div class="filters">'+[["day","Today"],["week","This week"],["month","This month"],["all","All time"]].map(([k,v])=>'<button class="'+(db.period===k?"on":"")+'" onclick="db.period=\''+k+'\';save()">'+v+'</button>').join("")+'</div>'}
function lines(xs){if(!xs.length)return '<div class="empty">No transactions yet</div>';const icons={Food:"🍽",Shopping:"🛍",Bills:"⚡",Transport:"🚕",Rent:"🏠",EMI:"📅",Health:"✚",Entertainment:"🎬",Travel:"✈",Groceries:"🛒",Salary:"↙",Refund:"↙",Other:"◈",Transfer:"⇄"};return [...xs].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).map(t=>'<div class="row"><div class="transaction-line" style="min-width:0"><div class="transaction-icon">'+(icons[t.category]||"◈")+'</div><div class="transaction-details"><strong>'+esc(t.note||t.category||"Transfer")+'</strong><div class="muted" style="margin-top:5px">'+esc(t.date)+' · '+esc(acct(t.account))+'</div><div class="hint">'+esc(t.category||"Transfer")+'</div></div></div><div style="text-align:right;flex-shrink:0"><strong class="'+(["income","transfer-in"].includes(t.type)?"green":"red")+'">'+(["income","transfer-in"].includes(t.type)?"+":"−")+INR(t.amount)+'</strong><div><button class="btn secondary" style="padding:5px 9px;margin-top:7px;font-size:10px" onclick="del(\''+t.id+'\')">Delete</button></div></div></div>').join("")}
function home(){let t=totals(),sum=db.accounts.reduce((s,a)=>s+balance(a.id),0),spent={},expenses=visible().filter(x=>x.type==="expense");expenses.forEach(x=>spent[x.category]=(spent[x.category]||0)+x.amount);let top=Object.entries(spent).sort((a,b)=>b[1]-a[1]),net=t.income-t.expense;if(!db.accounts.length)return '<div class="welcome"><span class="eyebrow">WELCOME TO POCKETFLOW</span><h2>Money, finally<br><em>in focus.</em></h2><p>Track every rupee without clutter. Start by adding an account.</p><div class="welcome-orb">◈</div><button class="btn" onclick="change(\'accounts\')">Add your first account ↗</button></div><div class="card"><h3>Get started</h3><div class="step"><b>01</b><div><strong>Add your account</strong><p>Just a nickname and starting balance.</p></div></div><div class="step"><b>02</b><div><strong>Import a bank CSV</strong><p>Categories and summaries update automatically. Live bank sync is not connected.</p></div></div></div>';let week=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");week.push({day:["S","M","T","W","T","F","S"][d.getDay()],amount:db.transactions.filter(x=>x.type==="expense"&&x.date===date).reduce((sum,x)=>sum+x.amount,0)})}let max=Math.max(1,...week.map(x=>x.amount));return '<div class="headline"><div><span class="eyebrow">YOUR MONEY AT A GLANCE</span><h2>Overview<span class="dot">.</span></h2></div><span class="sync-chip">● Offline tracking</span></div><div class="card hero"><div class="kicker">TOTAL TRACKED BALANCE</div><div class="balance">'+INR(sum)+'</div><div class="tiles"><div class="tile"><div class="muted">↙ Income</div><div class="value green">'+INR(t.income)+'</div></div><div class="tile"><div class="muted">↗ Spending</div><div class="value red">'+INR(t.expense)+'</div></div></div><p class="balance-foot">Calculated from records · Not a live bank balance</p></div><div class="quick-actions"><button onclick="change(\'add\')"><b>＋</b>Add expense</button><button onclick="change(\'import\')"><b>⇩</b>Import CSV</button><button onclick="change(\'accounts\')"><b>▣</b>My accounts</button></div><div class="section-head"><h3>Cash flow</h3><span class="quiet">Choose period</span></div>'+filters()+'<div class="metrics"><div class="metric"><small>NET CASH FLOW</small><strong>'+INR(net)+'</strong><span>Income minus spending</span></div><div class="metric"><small>TOP CATEGORY</small><strong>'+esc(top[0]?.[0]||"—")+'</strong><span>'+(top[0]?INR(top[0][1]):"No spending yet")+'</span></div></div><div class="section-head"><h3>Last 7 days</h3><span class="quiet">Daily spending</span></div><div class="card chart-card"><div class="bar-chart">'+week.map(x=>'<div class="bar-group"><div class="bar-track"><div class="bar-fill" style="height:'+Math.round(x.amount/max*100)+'%"></div></div><span>'+x.day+'</span></div>').join("")+'</div></div><div class="section-head"><h3>Your banks</h3><button onclick="change(\'accounts\')">View all ↗</button></div><div class="card">'+db.accounts.slice(0,4).map(a=>'<div class="bank-mini"><div class="bank-avatar">'+esc(a.name.slice(0,2).toUpperCase())+'</div><div class="bank-words"><b>'+esc(a.name)+'</b><small>'+esc(a.kind)+' · Tracked locally</small></div><div class="bank-money">'+INR(balance(a.id))+'</div></div>').join("")+'</div><div class="section-head"><h3>Recent activity</h3><button onclick="change(\'history\')">See all ↗</button></div><div class="card">'+lines([...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,5))+'</div><p class="privacy-inline">✧ Back up your data regularly from More.</p>'}
function accounts(){return '<h2>Your banks</h2><div class="notice">These balances are calculated from your opening balances and saved transactions. They are NOT connected live to banks.</div><div class="card">'+(db.accounts.map(a=>'<div class="row"><div><strong>'+esc(a.name)+'</strong><div class="muted">'+esc(a.kind)+'</div></div><b>'+INR(balance(a.id))+'</b></div>').join("")||'<div class="empty">Add your first bank or cash account.</div>')+'</div><div class="card"><h3>Add bank or cash</h3><form id="accountForm"><label>Account name</label><input name="name" placeholder="HDFC / IDFC / HSBC" required maxlength="70"><div class="grid"><div><label>Type</label><select name="kind"><option>Bank</option><option>Cash</option><option>Wallet</option></select></div><div><label>Starting balance ₹</label><input type="number" name="opening" step=".01" required value="0"></div></div><div class="actions"><button class="btn">Save account</button></div></form></div>'}
function accountOptions(){return db.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join("")}
function add(){if(!db.accounts.length)return '<div class="card">Add an account first.<div class="actions"><button class="btn" onclick="change(\'accounts\')">Add bank</button></div></div>';return '<h2>Add transaction</h2><div class="card"><form id="transactionForm"><label>Type</label><select name="type" id="kind" onchange="typeChange()"><option value="expense">Expense</option><option value="income">Income</option><option value="transfer">Transfer between my accounts</option></select><div class="grid"><div><label>Amount ₹</label><input name="amount" required type="number" min=".01" step=".01"></div><div><label>Date</label><input name="date" required type="date" value="'+today()+'"></div></div><label>Bank / account</label><select name="account">'+accountOptions()+'</select><div id="destination" class="hide"><label>Transfer to</label><select name="to">'+accountOptions()+'</select></div><div id="category"><label>Category</label><select name="category">'+categories.map(x=>'<option>'+x+'</option>').join("")+'</select></div><label>Merchant / note / UPI reference</label><input name="note" maxlength="220" placeholder="Shopping, salary, UPI payment..."><div class="actions"><button class="btn">Save transaction</button></div></form></div>'}
function typeChange(){let t=document.getElementById("kind").value;document.getElementById("destination").classList.toggle("hide",t!=="transfer");document.getElementById("category").classList.toggle("hide",t==="transfer")}
function history(){return '<h2>Transactions</h2>'+filters()+'<div class="card">'+lines(visible())+'</div>'}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function backup(){download("PocketFlow-backup-"+today()+".json",JSON.stringify({version:1,...db},null,2),"application/json")}
function csvExport(){let rows=[["Date","Type","Bank","Amount","Category","Note"],...db.transactions.map(x=>[x.date,x.type,acct(x.account),x.amount,x.category,x.note])];download("PocketFlow-"+today()+".csv",rows.map(r=>r.map(s=>'"'+String(s??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv")}
function settings(){return '<h2>Privacy & backup</h2><div class="notice">Your transactions stay in local storage on this device. Clearing Safari data or removing the app may erase them. Back up frequently. Backups are NOT encrypted: keep them private.</div><div class="card"><h3>Backup</h3><div class="actions"><button class="btn" onclick="backup()">Full JSON backup</button><button class="btn secondary" onclick="csvExport()">Export CSV</button></div><label>Restore backup</label><input type="file" accept=".json" id="restore"><button class="btn secondary" style="margin-top:12px" onclick="restore()">Restore selected backup</button></div><div class="card"><h3>Automatic bank syncing</h3><div class="notice">NOT ACTIVE. Real bank/UPI transaction collection requires an authorised data provider, consent and eligible bank access. Never enter OTP, bank password or UPI PIN here.</div></div><div class="card"><h3>Install</h3><p class="muted">Open the hosted app in iPhone Safari → Share → Add to Home Screen → Add.</p></div><div class="card"><button class="btn danger" onclick="erase()">Erase local data</button></div>'}
function restore(){let f=document.getElementById("restore").files[0];if(!f)return alert("Choose backup file");f.text().then(t=>{try{let d=JSON.parse(t);if(!Array.isArray(d.accounts)||!Array.isArray(d.transactions))throw Error("Invalid file");if(!confirm("Replace ALL existing data with this backup?"))return;db={accounts:d.accounts,transactions:d.transactions,period:"month"};save()}catch(e){alert("Invalid backup: "+e.message)}})}
function erase(){if(confirm("Erase all saved account and transaction data?")){db={accounts:[],transactions:[],period:"month"};save()}}
function del(id){let t=db.transactions.find(t=>t.id===id);if(!t||!confirm("Delete this transaction?"))return;db.transactions=db.transactions.filter(x=>x.id!==id&&(!t.group||x.group!==t.group));save()}
function csvParse(s){let out=[],row=[],f="",quote=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){f+='"';i++}else quote=!quote}else if(c===","&&!quote){row.push(f);f=""}else if((c==="\n"||c==="\r")&&!quote){if(c==="\r"&&s[i+1]==="\n")i++;row.push(f);if(row.some(x=>x.trim()))out.push(row);f="";row=[]}else f+=c}row.push(f);if(row.some(x=>x.trim()))out.push(row);return out}
function parseDate(s){s=String(s||"").trim();if(/^\d{4}-\d\d-\d\d/.test(s))return s.slice(0,10);let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);return m?(m[3].length===2?"20"+m[3]:m[3])+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"):null}
function num(s){return Number(String(s||"").replace(/[₹,\s]/g,"").replace(/^\((.*)\)$/,"-$1"))||0}
function category(note,type){if(type==="income")return /salary|payroll|wage/i.test(note)?"Salary":/refund|reversal/i.test(note)?"Refund":"Other";let n=note.toLowerCase();return /swiggy|zomato|restaurant|cafe|coffee/.test(n)?"Food":/uber|ola|metro|fuel|petrol/.test(n)?"Transport":/amazon|flipkart|meesho|myntra/.test(n)?"Shopping":/emi|loan|nach/.test(n)?"EMI":/electric|recharge|bill|broadband/.test(n)?"Bills":/grocery|mart|supermarket/.test(n)?"Groceries":"Other"}
function importPage(){return '<h2>Import bank statement</h2><div class="notice">CSV import only. Not a live bank connection. Check each row before import.</div><div class="card"><form id="csvForm"><label>Choose bank account</label><select name="account">'+accountOptions()+'</select><label>CSV file</label><input type="file" name="file" accept=".csv,text/csv" required><p class="hint">Example headers: Date, Description, Debit, Credit. Or Date, Amount, Type.</p><button class="btn">Preview transactions</button></form><div id="preview"></div></div>'}
function preview(file,account){let rows=csvParse(file),h=rows.shift().map(x=>x.toLowerCase().replace(/[^a-z]/g,"")),idx=(...ns)=>h.findIndex(x=>ns.some(n=>x.includes(n))),d=idx("date"),n=idx("description","narration","particular","remark","details"),deb=idx("debit","withdrawal"),cred=idx("credit","deposit"),amt=idx("amount"),typ=idx("type","drcr");if(d<0||deb<0&&cred<0&&amt<0)throw Error("Unsupported CSV headers");let existing=new Set(db.transactions.map(x=>x.fingerprint)),seen=new Set(),skipped=0;pending=[];for(let r of rows){let date=parseDate(r[d]);if(!date)continue;let note=String(r[n]||"Imported").slice(0,220),out=Math.abs(num(r[deb])),inc=Math.abs(num(r[cred]));if(deb<0&&cred<0){let a=num(r[amt]),k=String(r[typ]||"").toLowerCase();if(/credit|cr/.test(k)||a>0&&String(r[amt]).includes("+"))inc=Math.abs(a);else out=Math.abs(a)}for(let [type,amount] of [["expense",out],["income",inc]])if(amount>0){let fingerprint=[account,date,type,amount,note.toLowerCase().trim().replace(/\s+/g," ")].join("|");if(existing.has(fingerprint)||seen.has(fingerprint)){skipped++;continue}seen.add(fingerprint);pending.push({id:uid(),account,date,type,amount,note,category:category(note,type),fingerprint,source:"csv",created:Date.now()})}}document.getElementById("preview").innerHTML='<h3>Review import</h3><p class="hint">'+pending.length+' new · '+skipped+' possible duplicates skipped</p><div style="max-height:290px;overflow:auto">'+lines(pending.slice(0,20))+'</div><button class="btn" onclick="confirmImport()">Import '+pending.length+' transactions</button>'}
function confirmImport(){db.transactions.push(...pending);pending=[];change("home");save()}
function render(){let map={home,accounts,add,history,import:importPage,settings};document.getElementById("app").innerHTML=map[tab]();document.getElementById("nav").innerHTML=[["home","⌂","Home"],["accounts","▣","Banks"],["add","+","Add"],["history","≡","History"],["import","⇩","Import"],["settings","⚙","More"]].map(([k,i,v])=>'<button class="'+(tab===k?"on":"")+'" onclick="change(\''+k+'\')"><b>'+i+'</b>'+v+'</button>').join("");let f=document.getElementById("accountForm");if(f)f.onsubmit=e=>{e.preventDefault();let v=new FormData(f),opening=Number(v.get("opening"));if(!Number.isFinite(opening))return alert("Invalid balance");db.accounts.push({id:uid(),name:String(v.get("name")).trim(),opening,kind:v.get("kind")});save()};f=document.getElementById("transactionForm");if(f)f.onsubmit=e=>{e.preventDefault();let v=new FormData(f),amount=Number(v.get("amount")),type=v.get("type"),account=v.get("account"),dest=v.get("to");if(!Number.isFinite(amount)||amount<=0)return alert("Invalid amount");if(type==="transfer"&&(account===dest||db.accounts.length<2))return alert("Select different accounts");let base={id:uid(),date:v.get("date"),amount,note:String(v.get("note")||"").trim(),created:Date.now()};if(type==="transfer"){let group=uid();db.transactions.push({...base,type:"transfer-out",account,group,category:"Transfer"},{...base,id:uid(),type:"transfer-in",account:dest,group,category:"Transfer"})}else db.transactions.push({...base,type,account,category:v.get("category")});change("home");save()};f=document.getElementById("csvForm");if(f)f.onsubmit=async e=>{e.preventDefault();let v=new FormData(f),file=v.get("file");if(!file||!file.size)return;if(file.size>8000000)return alert("Use CSV under 8 MB");try{preview(await file.text(),v.get("account"))}catch(err){alert(err.message)}}}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});render();
</script></body></html>
